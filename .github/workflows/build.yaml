name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        env:
          - name: mcp-auth-proxy-linux-amd64
            os: linux
            arch: amd64
          - name: mcp-auth-proxy-linux-arm64
            os: linux
            arch: arm64
          - name: mcp-auth-proxy-darwin-amd64
            os: darwin
            arch: amd64
          - name: mcp-auth-proxy-darwin-arm64
            os: darwin
            arch: arm64
          - name: mcp-auth-proxy-windows-amd64.exe
            os: windows
            arch: amd64
          - name: mcp-auth-proxy-windows-arm64.exe
            os: windows
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.env.os }}
          GOARCH: ${{ matrix.env.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
        run: go build -trimpath -ldflags "-X main.version=${VERSION}" -o bin/${{ matrix.env.name }} .

      - name: Publish artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.env.name }}
          path: bin/${{ matrix.env.name }}

  # Uploading to the release needs write access; it only runs for releases,
  # never for pull requests.
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bin
          merge-multiple: true

      - name: Publish artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" bin/*
