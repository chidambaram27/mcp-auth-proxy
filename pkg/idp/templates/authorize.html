<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authorize - MCP Auth Proxy</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      .logo {
        max-width: 180px;
        max-height: 64px;
        margin-bottom: 1.5rem;
      }
      h1 {
        color: #333;
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        color: #666;
        margin: 0 0 1.75rem;
        line-height: 1.5;
      }
      button {
        width: 100%;
        padding: 12px 20px;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      {{if .LogoURL}}<img class="logo" src="{{.LogoURL}}" alt="" />{{end}}
      <h1>Authorize access</h1>
      <p>An application is requesting access to <strong>{{.ServerHost}}</strong> on your behalf.</p>
      <form method="post">
        <button type="submit">Authorize</button>
      </form>
    </div>
  </body>
</html>
